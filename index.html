<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1114">
<meta name="description" content="9회말 2아웃, 버저비터, 프리킥. 공 하나로 갈리는 세 장면을 직접 해 보는 스포츠 게임.">
<title>승부처</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  body{touch-action:manipulation}
  #app{overflow-y:auto;padding:calc(28px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
  .live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mute)}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--red)}
  h1{font-size:clamp(62px,19vw,92px);line-height:.9;margin:2px 0 0;letter-spacing:-1px}
  .sub{margin:0 0 10px;font-size:16px;font-weight:700;color:#D5D9DD}
  .card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-decoration:none;color:var(--paper);background:var(--panel);
    padding:16px;position:relative}
  .card:active{filter:brightness(.9)}
  .card:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
  .card small{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:7px}
  .card small::before{content:"";width:9px;height:9px;background:var(--c)}
  .card b{font-family:"Black Han Sans";font-weight:400;font-size:32px;line-height:1.05}
  .card .bug{align-self:center;grid-row:2/4;grid-column:2;background:#0A0C0E;padding:8px 10px;font-family:"Barlow Condensed";font-weight:700;font-size:22px;line-height:1;text-align:right;min-width:86px}
  .card .bug em{display:block;font-style:normal;font-size:12px;color:var(--mute);font-family:"IBM Plex Sans KR";margin-bottom:4px}
  .card span{font-size:13px;font-weight:700;color:#C9CDD1}
  .card .rec{grid-column:1/-1;display:flex;gap:16px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
  .card .rec strong{font-family:"Barlow Condensed";font-size:18px;color:var(--hi);margin-left:4px}
  .note{margin:auto 0 0;font-size:12px;color:var(--mute);text-align:center;padding-top:8px}
</style>
</head>
<body>
<div id="app">
  <span class="live"><i></i>지금 승부처</span>
  <h1>승부처</h1>
  <p class="sub">공 하나로 결과가 갈리는 세 장면</p>
  <a class="card" href="baseball.html" style="--c:#E23A3A">
    <small>야구 · 포수 뒤 시점 타격</small>
    <b>9회말 2아웃</b>
    <div class="bug"><em>9회말</em>4 : 5</div>
    <span>커서를 공에 대고, 들어오는 순간 스윙</span>
    <div class="rec">끝내기 <strong id="rBb">0/45</strong>홈런 더비 <strong id="bBb">-</strong></div>
  </a>
  <a class="card" href="hoops.html" style="--c:#F07A26">
    <small>농구 · 슛 미터</small>
    <b>버저비터</b>
    <div class="bug"><em>4쿼터</em>0:01.6</div>
    <span>미터 꼭대기에서 손을 뗀다</span>
    <div class="rec">클러치 <strong id="rHp">0/45</strong>3점 콘테스트 <strong id="bHp">-</strong></div>
  </a>
  <a class="card" href="freekick.html" style="--c:#3DBA6A">
    <small>축구 · 직접 프리킥</small>
    <b>프리킥 한 방</b>
    <div class="bug"><em>거리</em>25M</div>
    <span>벽을 넘기고 골키퍼를 속여라</span>
    <div class="rec">프리킥 <strong id="rFk">0/90</strong>무한 도전 <strong id="bFk">-</strong></div>
  </a>
  <p class="note">기록은 이 기기에 저장된다</p>
</div>
<script src="common.js"></script>
<script>
  const d = G.save.data, sum = (k) => d[k].st.reduce((a, b) => a + (b || 0), 0);
  [['Bb', 'bb', 45, '개'], ['Hp', 'hp', 45, '점'], ['Fk', 'fk', 90, '골']].forEach(([id, k, max, u]) => {
    document.getElementById('r' + id).textContent = sum(k) + '/' + max;
    document.getElementById('b' + id).textContent = d[k].best ? d[k].best + u : '-';
  });
</script>
</body>
</html>
